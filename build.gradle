def appImageBuildDir = layout.buildDirectory.dir("appimage")
def appImageToolUrl = "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
def ffmpegTarUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"

tasks.register("downloadAppImageTool") {
    def tool = appImageBuildDir.get().file("appimagetool-x86_64.AppImage")
    outputs.file(tool)
    doLast {
        if (!tool.asFile.exists()) {
            println "Downloading appimagetool..."
            tool.asFile.parentFile.mkdirs()
            new URL(appImageToolUrl).withInputStream { input ->
                tool.asFile.withOutputStream { output -> output << input }
            }
            tool.asFile.setExecutable(true)
        }
    }
}

tasks.register("downloadFfmpeg") {
    def tar = appImageBuildDir.get().file("ffmpeg-static.tar.xz")
    outputs.file(tar)
    doLast {
        if (!tar.asFile.exists()) {
            println "Downloading static ffmpeg..."
            tar.asFile.parentFile.mkdirs()
            new URL(ffmpegTarUrl).withInputStream { input ->
                tar.asFile.withOutputStream { output -> output << input }
            }
        }
    }
}

tasks.register("prepareAppImageDir") {
    dependsOn(tasks.named("packageAppImage"), tasks.named("downloadFfmpeg"))
    def appDir = appImageBuildDir.get().dir("AppDir")
    def appImageOutput = layout.buildDirectory.dir("compose/binaries/main/app")
    outputs.dir(appDir)
    doLast {
        def target = appDir.asFile
        project.delete(target)
        target.mkdirs()
        project.copy {
            from appImageOutput.get().dir("chapter-editor").asFile
            into new File(target, "chapter-editor")
        }
        new File(target, "AppRun").withWriter { writer ->
            writer.write('''#!/bin/sh
SELF="$(readlink -f "$0")"
HERE="${SELF%/*}"
export PATH="$HERE/usr/bin:$PATH"
exec "$HERE/chapter-editor/bin/chapter-editor" "$@"
''')
        }
        new File(target, "AppRun").setExecutable(true)
        project.copy {
            from file("packaging/chapter-editor.desktop")
            into target
        }
        project.copy {
            from file("Logo-128x128.png")
            into target
            rename { "chapter-editor.png" }
        }
        project.copy {
            from file("Logo-128x128.png")
            into target
            rename { ".DirIcon" }
        }
        def usrBin = new File(target, "usr/bin")
        usrBin.mkdirs()
        def ffmpegTar = appImageBuildDir.get().file("ffmpeg-static.tar.xz").asFile
        def tarProcess = new ProcessBuilder("tar", "-xJf", ffmpegTar.absolutePath,
            "--strip-components=2", "--wildcards", "*/bin/ffmpeg")
            .directory(usrBin)
            .redirectErrorStream(true)
            .start()
        def tarOutput = tarProcess.inputStream.text
        if (tarProcess.waitFor() != 0) {
            throw new GradleException("Failed to extract static ffmpeg: $tarOutput")
        }
    }
}

tasks.register("packageLinuxAppImage") {
    group = "build"
    description = "Builds a single-file Linux x86_64 AppImage (bundles static ffmpeg)"
    dependsOn(tasks.named("prepareAppImageDir"), tasks.named("downloadAppImageTool"))
    def out = appImageBuildDir.get().file("chapter-editor-${project.version}-x86_64.AppImage")
    outputs.file(out)
    doLast {
        def tool = appImageBuildDir.get().file("appimagetool-x86_64.AppImage").asFile
        out.asFile.delete()
        def toolProcessBuilder = new ProcessBuilder(tool.absolutePath,
            appImageBuildDir.get().dir("AppDir").asFile.absolutePath,
            out.asFile.absolutePath)
            .redirectErrorStream(true)
        toolProcessBuilder.environment().put("APPIMAGE_EXTRACT_AND_RUN", "1")
        def toolProcess = toolProcessBuilder.start()
        def toolOutput = toolProcess.inputStream.text
        if (toolProcess.waitFor() != 0) {
            throw new GradleException("appimagetool failed: $toolOutput")
        }
    }
}

tasks.register("packageWindowsX64") {
    group = "build"
    description = "Builds a Windows x86_64 installer (Exe)"
    dependsOn(tasks.named("packageExe"))
    doFirst {
        if (!System.getProperty("os.name").toLowerCase().contains("win")) {
            throw new GradleException("The Windows x64 installer can only be built on a Windows host.")
        }
    }
}
